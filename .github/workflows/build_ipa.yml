name: Build IPA for ESign

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA for ESign
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate iOS config for macOS runner
        run: flutter build ios --config-only --no-codesign

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build with Xcode (No Codesign / No Team ID)
        run: |
          cd ios
          xcodebuild clean build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Payload into unsigned .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios_derived/Build/Products/Release-iphoneos -name "Runner.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found, searching all build outputs:"
            find build -name "*.app" -type d
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No Runner.app produced. Build failed."
            exit 1
          fi

          echo "Packaging: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -9 MBBMoney_Cyberpunk_ESign.ipa Payload/
          ls -lh MBBMoney_Cyberpunk_ESign.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBBMoney_Cyberpunk_ESign_IPA
          path: MBBMoney_Cyberpunk_ESign.ipa
          retention-days: 14
