name: Build IPA for ESign

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA for ESign
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned release)
        # `flutter build` runs pod install, resolves the workspace path and
        # emits Runner.app in a predictable location — the manual pod install +
        # xcodebuild sequence used to fail on the runner because the generated
        # Podfile referenced the local Windows Flutter SDK path.
        run: |
          flutter build ios --release --no-codesign --verbose 2>&1 | tail -n 60

      - name: Ensure Podfile is scoped to the runner
        # The Flutter tool regenerates ios/Flutter/Generated.xcconfig with the
        # runner's own FLUTTER_ROOT, so the checked-in Podfile resolves cleanly.
        run: |
          echo "FLUTTER_ROOT resolved by flutter tool:"
          grep FLUTTER_ROOT ios/Flutter/Generated.xcconfig || true

      - name: Package Payload into unsigned .ipa
        run: |
          mkdir -p Payload
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app not found, searching build outputs:"
            find build -name "Runner.app" -type d
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No Runner.app produced. Build failed."
            exit 1
          fi

          echo "Packaging: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -9 MBBMoney_Cyberpunk_ESign.ipa Payload/
          ls -lh MBBMoney_Cyberpunk_ESign.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBBMoney_Cyberpunk_ESign_IPA
          path: MBBMoney_Cyberpunk_ESign.ipa
          retention-days: 14
