name: mbb_money
description: "Quản lý thu chi cá nhân cho iPhone — đọc giao dịch MB Bank qua iOS Shortcut và SePay API."
publish_to: "none"
version: 0.2.0+4

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Local database
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5

  # State management
  provider: ^6.1.2

  # Networking (SePay pull sync)
  http: ^1.2.2

  # Local, encrypted storage for the SePay token
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Formatting
  intl: ^0.20.1

  # Universal links / deep links from iOS Shortcuts
  app_links: ^6.3.2

  # Icons & small utilities
  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.7
  image_picker: ^1.2.1
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
